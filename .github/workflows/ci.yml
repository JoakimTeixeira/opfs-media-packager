name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [Lint, Code quality, Typecheck]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        if: matrix.check == 'Lint'
        run: npm run lint
      - name: Check code quality
        if: matrix.check == 'Code quality'
        run: npm run check:quality
      - name: Typecheck
        if: matrix.check == 'Typecheck'
        run: npm run typecheck

  tests:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Run tests and check coverage
        run: |
          mkdir -p reports/ci-metrics
          npm run coverage:check -- --reporter=default --reporter=json --outputFile.json=reports/ci-metrics/vitest-results.json
      - name: Upload test metrics
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics
          path: |
            reports/ci-metrics/vitest-results.json
            coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 1

  harness:
    name: Harness maturity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce harness maturity
        run: npm run harness:score -- --min-level 4
      - name: Save harness score report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p reports/ci-metrics
          npx harness-score --json > reports/ci-metrics/harness-score.json
      - name: Upload harness metrics
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: harness-metrics
          path: reports/ci-metrics/harness-score.json
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Playwright image version
        run: node -e 'if (require("@playwright/test/package.json").version !== "1.58.2") throw new Error("Update the Playwright image to match package-lock.json")'
      - name: Build extension
        run: npm run build
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  publish-badges:
    name: Publish CI badges
    needs: [quality, tests, harness, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ci-metric-badges
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - name: Download test metrics
        uses: actions/download-artifact@v4
        with:
          name: test-metrics
          path: ci-metrics
      - name: Download harness metrics
        uses: actions/download-artifact@v4
        with:
          name: harness-metrics
          path: ci-metrics
      - name: Generate CI metric badge data
        run: node scripts/create-ci-badges.ts ci-metrics/harness-score.json ci-metrics/reports/ci-metrics/vitest-results.json ci-metrics/coverage/coverage-summary.json ci-badges
      - name: Publish CI metric badges
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ci-badges
          publish_dir: ./ci-badges
          force_orphan: true
          full_commit_message: Update CI metric badges
